name: Update site

on:
  schedule:
    # Thai market, 10:00-16:45 Bangkok
    - cron: "*/15 3-9 * * 1-5"
    # US market; 13:00-21:45 UTC covers 9:30-16:00 New York in both standard and daylight time
    - cron: "*/15 13-21 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # A failed check or fetch stops the run, so the previous deployment stays online.
      - run: python scripts/check_content.py
      - name: Fetch latest prices
        run: |
          python scripts/fetch_prices.py latest us
          python scripts/fetch_prices.py latest th
      - run: python scripts/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
