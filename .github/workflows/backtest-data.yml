name: Save backtest history

# Run by hand when a longer price history is needed for testing trading ideas.
# Writes backtest/<market>/*.csv; the site and the daily history are not touched.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "th, thall (every SET stock) or us"
        default: "th"
      period:
        description: "yfinance period, e.g. 3y"
        default: "3y"

permissions:
  contents: write

concurrency:
  group: history

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_prices.py history "$MARKET" --period "$PERIOD" --out backtest
        env:
          MARKET: ${{ inputs.market }}
          PERIOD: ${{ inputs.period }}
      - name: Save the Thai market benchmark (SET50 ETF TDEX)
        if: ${{ inputs.market == 'th' }}
        env:
          PERIOD: ${{ inputs.period }}
        run: |
          python - <<'PY'
          import os, pathlib, yfinance as yf
          frame = yf.download("TDEX.BK", period=os.environ["PERIOD"], interval="1d", auto_adjust=False, progress=False)
          if frame is None or frame.empty:
              print("TDEX: no data"); raise SystemExit(0)
          if frame.columns.nlevels > 1:
              frame.columns = frame.columns.get_level_values(0)
          out = pathlib.Path("backtest/bench"); out.mkdir(parents=True, exist_ok=True)
          frame[["Open", "High", "Low", "Close", "Adj Close", "Volume"]].dropna(subset=["Close"]).round(4).to_csv(out / "TDEX.csv", index_label="Date")
          print("TDEX rows:", len(frame))
          PY
      - name: Commit backtest history
        env:
          MARKET: ${{ inputs.market }}
          PERIOD: ${{ inputs.period }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest
          git diff --cached --quiet && exit 0
          git commit -m "Update backtest history $MARKET $PERIOD $(date -u +%F)"
          git pull --rebase
          git push
