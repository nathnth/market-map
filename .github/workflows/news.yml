name: Fetch Thai news

# Run by hand to refresh the news headlines without touching prices
# (save-history also refreshes them after the Thai close).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_news.py
      - name: Commit news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/news-th.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update Thai news $(date -u +%F)"
          git pull --rebase
          git push
